line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
  "E501",   # long lines in prose-heavy module docstrings
  "B905",   # zip(strict=) - every zip here is same-length by construction
]

[lint.per-file-ignores]
"validate.py" = ["E731"]  # lambda helpers keep the check list readable
