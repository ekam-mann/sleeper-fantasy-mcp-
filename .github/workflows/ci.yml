name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so dependency and code scanning still runs on a quiet repo.
    - cron: "17 6 * * 1"

# Least privilege by default; jobs opt into more only where they need it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs, not tags. A tag is mutable -
      # whoever controls the action can repoint v4 at new code, and it runs
      # here with whatever permissions this job holds. The trailing comment
      # records which release each SHA was, so upgrades stay readable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        # tests/ is deliberately offline: no network, no configured league.
        # validate.py is the full correctness suite but needs both, so it is
        # run locally rather than in CI.
        run: python -m pytest tests/ -q

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
        with:
          languages: python
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3.37.7
